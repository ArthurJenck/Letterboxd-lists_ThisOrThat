<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#14181c"/>

  <!-- Left film card (green) -->
  <rect x="3" y="7" width="11" height="18" rx="2" fill="#1c2228" stroke="#00e054" stroke-width="1.2"/>
  <!-- Left perforations -->
  <rect x="4.5" y="9" width="2" height="2.5" rx="0.5" fill="#00e054" opacity="0.7"/>
  <rect x="4.5" y="13" width="2" height="2.5" rx="0.5" fill="#00e054" opacity="0.7"/>
  <rect x="4.5" y="17" width="2" height="2.5" rx="0.5" fill="#00e054" opacity="0.7"/>
  <rect x="4.5" y="21" width="2" height="2.5" rx="0.5" fill="#00e054" opacity="0.7"/>

  <!-- Right film card (orange) -->
  <rect x="18" y="7" width="11" height="18" rx="2" fill="#1c2228" stroke="#ff8000" stroke-width="1.2"/>
  <!-- Right perforations -->
  <rect x="25.5" y="9" width="2" height="2.5" rx="0.5" fill="#ff8000" opacity="0.7"/>
  <rect x="25.5" y="13" width="2" height="2.5" rx="0.5" fill="#ff8000" opacity="0.7"/>
  <rect x="25.5" y="17" width="2" height="2.5" rx="0.5" fill="#ff8000" opacity="0.7"/>
  <rect x="25.5" y="21" width="2" height="2.5" rx="0.5" fill="#ff8000" opacity="0.7"/>

  <!-- VS divider -->
  <line x1="16" y1="9" x2="16" y2="23" stroke="#99aabb" stroke-width="0.8" opacity="0.5"/>
  <text x="16" y="17.5" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="700" fill="#99aabb" letter-spacing="0">VS</text>
</svg>
